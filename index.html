<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antipos Team</title>
<meta name="description" content="КотоВасия — уютный кликер-антистресс с котиками по настоящим детским рисункам.">
<link rel="icon" href="img/kotovasia.png">
<style>
  :root { --bg:#fdf6ec; --card:#fffaf3; --ink:#4a3a2c; --muted:#8a7563; --accent:#f0a33c; --line:#ecdcc6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:28px; margin:0 0 20px; }
  .game { display:flex; gap:20px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; flex-wrap:wrap; }
  .game img { width:120px; height:120px; border-radius:26px; }
  .game div { flex:1; min-width:220px; }
  .game h2 { margin:0 0 4px; font-size:22px; }
  .game p { margin:0 0 12px; color:var(--muted); }
  .btn { display:inline-block; margin:4px 6px 4px 0; padding:9px 16px; border-radius:999px; background:var(--accent); color:#3b2a16; text-decoration:none; font-weight:700; }
  footer { color:var(--muted); font-size:14px; margin-top:32px; text-align:center; }
  footer a { color:#c9771a; }
</style>
</head>
<body>
<main>
  <h1>Antipos Team</h1>
  <div class="game">
    <img src="img/kotovasia.png" alt="КотоВасия">
    <div>
      <h2>КотоВасия: кликер-антистресс</h2>
      <p>Уютный кликер с котиками по настоящим детским рисункам.<br>A cozy clicker with cats from real children's drawings.</p>
      <a class="btn" href="https://yandex.ru/games/app/529345">Яндекс Игры</a>
    </div>
  </div>
  <footer>
    <a href="privacy/">Политика конфиденциальности / Privacy Policy</a> ·
    <a href="mailto:antipos@vk.com">antipos@vk.com</a> ·
    <a href="https://vk.ru/kotovasia.clicker">ВКонтакте</a>
  </footer>
</main>
</body>
</html>
