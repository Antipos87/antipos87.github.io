		<style>

	<body>
		<canvas id="canvas">

		</noscript>

		<div id="status">

		<script>
// Read by YandexSDK.gd: which site this page is for (vk.html sets 'vk') and whether
// purchases are on (window.catIAPEnabled, set below from CAT_IAP_ENABLED).
window.catPlatform = 'yandex';
window.catIAPEnabled = false;
window.ysdk = null;
window.ysdkPlayerPromise = null;
window.ysdkPaymentsPromise = null;
window.yandexLang = 'ru';
window.catPlatformPaused = false;
function notifyGamePause(event) {
	if (window.godot_ad_callback) window.godot_ad_callback(event);
}

// Cloud saves (Yandex Player Data API). Godot calls these two via JavaScriptBridge.eval;
// window.ysdkPlayerPromise resolves once (started right after YaGames.init()), so calls
// made before the player is ready just wait on the same promise instead of failing.
window.catCloudLoad = function (token) {
	const respond = (payload) => { if (window.godot_save_callback) window.godot_save_callback('load_ok', token, payload); };
	const fail = () => { if (window.godot_save_callback) window.godot_save_callback('load_err', token, ''); };
	if (!window.ysdkPlayerPromise) { fail(); return; }
	window.ysdkPlayerPromise
		.then((player) => player.getData(['save']))
		.then((data) => respond(JSON.stringify((data && data.save) || {})))
		.catch((e) => { console.warn('[YandexSDK] getData error', e); fail(); });
};
window.catCloudSave = function (token, jsonPayload) {
	const respond = (ok) => { if (window.godot_save_callback) window.godot_save_callback(ok ? 'save_ok' : 'save_err', token, ''); };
	if (!window.ysdkPlayerPromise) { respond(false); return; }
	let parsed;
	try { parsed = JSON.parse(jsonPayload); } catch (e) { respond(false); return; }
	window.ysdkPlayerPromise
		.then((player) => player.setData({ save: parsed }, true))
		.then(() => respond(true))
		.catch((e) => { console.warn('[YandexSDK] setData error', e); respond(false); });
};
// In-app purchases (Yandex Payments API). Same request/callback pattern as the
// cloud save bridge above. getPurchases()/consumePurchase() exist specifically so
// a purchase that succeeded but never got consumed (closed tab mid-flow, crash,
// etc.) is caught and settled on the next launch — Yandex requires this to pass
// moderation, since unconsumed purchases block it.
window.catIAPGetPurchases = function (token) {
	const respond = (payload) => { if (window.godot_iap_callback) window.godot_iap_callback('purchases_ok', token, payload); };
	const fail = () => { if (window.godot_iap_callback) window.godot_iap_callback('purchases_err', token, ''); };
	if (!window.ysdkPaymentsPromise) { fail(); return; }
	window.ysdkPaymentsPromise
		.then((payments) => payments.getPurchases())
		.then((purchases) => respond(JSON.stringify(purchases || [])))
		.catch((e) => { console.warn('[YandexSDK] getPurchases error', e); fail(); });
};
window.catIAPPurchase = function (token, productID) {
	const respond = (purchaseToken) => { if (window.godot_iap_callback) window.godot_iap_callback('purchase_ok', token, purchaseToken); };
	const fail = () => { if (window.godot_iap_callback) window.godot_iap_callback('purchase_err', token, ''); };
	if (!window.ysdkPaymentsPromise) { fail(); return; }
	window.ysdkPaymentsPromise
		.then((payments) => payments.purchase({ id: productID }))
		.then((purchase) => respond((purchase && purchase.purchaseToken) || ''))
		.catch((e) => { console.warn('[YandexSDK] purchase error/cancel', e); fail(); });
};
window.catIAPConsume = function (token, purchaseToken) {
	const respond = (ok) => { if (window.godot_iap_callback) window.godot_iap_callback(ok ? 'consume_ok' : 'consume_err', token, ''); };
	if (!window.ysdkPaymentsPromise) { respond(false); return; }
	window.ysdkPaymentsPromise
		.then((payments) => payments.consumePurchase(purchaseToken))
		.then(() => respond(true))
		.catch((e) => { console.warn('[YandexSDK] consumePurchase error', e); respond(false); });
};

// Authorization + leaderboards. Reading the table works for guests; writing a score
// needs a logged-in Yandex account, and the login dialog may only be opened from a
// player's tap (catAuthOpen is called from the "Войти" button).
function catPlayerAuthorized(player) {
	if (!player) return false;
	if (typeof player.isAuthorized === 'function') return player.isAuthorized();
	return typeof player.getMode === 'function' && player.getMode() !== 'lite';
}
function catLbRespond(event, token, payload) {
	if (window.godot_lb_callback) window.godot_lb_callback(event, token, payload || '');
}
window.catAuthState = function (token) {
	if (!window.ysdkPlayerPromise) { catLbRespond('auth_state', token, 'false'); return; }
	window.ysdkPlayerPromise
		.then((player) => catLbRespond('auth_state', token, String(catPlayerAuthorized(player))))
		.catch(() => catLbRespond('auth_state', token, 'false'));
};
window.catAuthOpen = function (token) {
	if (!window.ysdk || !window.ysdk.auth) { catLbRespond('auth_state', token, 'false'); return; }
	window.ysdk.auth.openAuthDialog()
		.then(() => {
			// The old player object stays a guest one: fetch it again, and let cloud
			// saves use the logged-in player from now on.
			window.ysdkPlayerPromise = window.ysdk.getPlayer();
			window.ysdkPlayerPromise.catch(() => {});
			return window.ysdkPlayerPromise;
		})
		.then((player) => catLbRespond('auth_state', token, String(catPlayerAuthorized(player))))
		.catch((e) => { console.warn('[YandexSDK] openAuthDialog closed/failed', e); catLbRespond('auth_state', token, 'false'); });
};
window.catLbSetScore = function (token, name, score) {
	const fail = () => catLbRespond('score_err', token, '');
	if (!window.ysdk || !window.ysdk.leaderboards || !window.ysdkPlayerPromise) { fail(); return; }
	window.ysdkPlayerPromise
		.then((player) => {
			if (!catPlayerAuthorized(player)) throw new Error('not authorized');
			return window.ysdk.leaderboards.setScore(name, Math.min(Math.floor(score), Number.MAX_SAFE_INTEGER));
		})
		.then(() => catLbRespond('score_ok', token, ''))
		.catch((e) => { console.warn('[YandexSDK] setScore error', e); fail(); });
};
window.catLbGetEntries = function (token, name) {
	const fail = () => catLbRespond('entries_err', token, '');
	if (!window.ysdk || !window.ysdk.leaderboards || !window.ysdkPlayerPromise) { fail(); return; }
	window.ysdkPlayerPromise
		.catch(() => null)
		.then((player) => {
			const authorized = catPlayerAuthorized(player);
			const myID = authorized && typeof player.getUniqueID === 'function' ? player.getUniqueID() : '';
			const options = authorized ? { quantityTop: 10, includeUser: true, quantityAround: 2 } : { quantityTop: 10 };
			return window.ysdk.leaderboards.getEntries(name, options).then((result) => ({ result, authorized, myID }));
		})
		.then(({ result, authorized, myID }) => {
			const entries = ((result && result.entries) || []).map((e) => ({
				rank: e.rank,
				score: e.score,
				name: (e.player && e.player.publicName) || '',
				me: !!myID && !!e.player && e.player.uniqueID === myID,
			}));
			catLbRespond('entries_ok', token, JSON.stringify({ authorized, userRank: (result && result.userRank) || 0, entries }));
		})
		.catch((e) => { console.warn('[YandexSDK] getEntries error', e); fail(); });
};

document.addEventListener('visibilitychange', () => {
	notifyGamePause(document.hidden ? 'visibility_pause' : 'visibility_resume');
});

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"CatClickerGodot","experimentalVK":false,"fileSizes":{"CatClickerGodot.pck":20386520,"CatClickerGodot.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

function detectLanguage(sdk) {
	try {
		// Read the SDK property on every startup, including debug-panel launches.
		const sdkLanguage = sdk ? sdk.environment.i18n.lang : 'ru';
		const language = String(sdkLanguage || 'ru').toLowerCase().split(/[-_]/)[0];
		const supported = ['ru', 'en', 'kk', 'de', 'fr', 'es', 'ja', 'zh', 'ko', 'ar'];
		if (supported.includes(language)) return language;
		return ['be', 'kk', 'uk', 'uz'].includes(language) ? 'ru' : 'en';
	} catch (e) {
		console.warn('[YandexSDK] Ошибка чтения языка:', e);
		return 'ru';
	}
}
// Must match the game name entered for each language in the Yandex draft (req. 5.1.3).
const CAT_GAME_TITLES = {
	ru: 'КотоВасия: кликер-антистресс',
	en: 'KotoVasia: Anti-Stress Clicker',
	kk: 'КотоВасия: антистресс кликер',
	de: 'KotoVasia: Anti-Stress-Clicker',
	fr: 'KotoVasia: clicker anti-stress',
	es: 'KotoVasia: clicker antiestrés',
	ja: 'KotoVasia: 癒やしのクリッカー',
	zh: 'KotoVasia: 解压点击游戏',
	ko: 'KotoVasia: 힐링 클리커',
	ar: 'KotoVasia: لعبة نقر مضادة للتوتر',
};
// Godot overwrites document.title with the project name while it boots. A MutationObserver
// puts the right name back whenever anything else writes the title; the game calls
// catSetTitle when the player switches language.
window.catWantedTitle = CAT_GAME_TITLES.ru;
window.catSetTitle = function (lang) {
	window.catWantedTitle = CAT_GAME_TITLES[lang] || CAT_GAME_TITLES.en;
	if (document.title !== window.catWantedTitle) document.title = window.catWantedTitle;
};
new MutationObserver(() => {
	if (document.title !== window.catWantedTitle) document.title = window.catWantedTitle;
}).observe(document.head, { subtree: true, childList: true, characterData: true });
function startGodotEngine(targetLang) {
	window.yandexLang = targetLang;
	window.catSetTitle(targetLang);
	GODOT_CONFIG['locale'] = targetLang;
	console.log('[YandexSDK] Запуск движка с языком:', targetLang);

	const engine = new Engine(GODOT_CONFIG);
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}

// Pikabu Games build: the game talks to "window.ysdk" as it does on Yandex; this file makes
// that object out of the Pikabu SDK (games.pikabu.ru/sdk/docs), so the GDScript side
// (YandexSDK.gd) stays the same. Put into the exported index.html by make_pikabu_build.py.
//   ads:      ysdk.adv.showFullscreenAdv / showRewardedVideo -> sdk.ads.fullscreen / rewarded
//   ready:    ysdk.features.LoadingAPI.ready()              -> sdk.gameStarted()
//   saves:    player.getData / setData                       -> CAT_CLOUD_URL (our Yandex Cloud
//             function, checks the player's signed token); empty = this browser only
//   language: always Russian first (a platform rule)
//   no leaderboards, no banners on Pikabu.

window.catPlatform = 'pikabu';  // read by YandexSDK.gd: no leaderboard here
const CAT_CLOUD_URL = '';  // the save function's URL; until it exists, saves stay in the browser
const CAT_LOCAL_KEY = 'kotovasia_pikabu_save';

async function catCloudGet(sdk) {
	if (!CAT_CLOUD_URL) {
		try { return { save: JSON.parse(localStorage.getItem(CAT_LOCAL_KEY) || '{}') }; } catch (e) { return { save: {} }; }
	}
	const token = await sdk.player.getSignedData();
	const r = await fetch(CAT_CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ op: 'load', token }) });
	if (!r.ok) throw new Error('cloud load ' + r.status);
	const body = await r.json();
	return { save: body.save || {} };
}

async function catCloudPut(sdk, save) {
	if (!CAT_CLOUD_URL) {
		try { localStorage.setItem(CAT_LOCAL_KEY, JSON.stringify(save || {})); } catch (e) { /* private mode: the game's own save still works */ }
		return;
	}
	const token = await sdk.player.getSignedData();
	const r = await fetch(CAT_CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ op: 'save', token, save: save || {} }) });
	if (!r.ok) throw new Error('cloud save ' + r.status);
}

function catPikabuPlayer(sdk) {
	const p = sdk.player;
	return {
		isAuthorized: () => !!p.isAuthorized,
		getMode: () => (p.isAuthorized ? '' : 'lite'),
		getUniqueID: () => p.id,
		getName: () => p.name,
		getData: () => catCloudGet(sdk),
		setData: (data) => catCloudPut(sdk, data && data.save),
	};
}

function catMakeYsdkShim(sdk) {
	const ads = sdk.ads || {};
	// Same callbacks as Yandex: onOpen, onRewarded, onClose, onError. The game pauses itself
	// (tree + sound) between its request and onClose/onError.
	const run = async (api, cb, rewarded) => {
		try {
			if (!api || !api.isSupported || !(await api.canShow())) {
				if (cb.onError) cb.onError('unavailable');
				return;
			}
			if (cb.onOpen) cb.onOpen();
			const result = await api.show();
			if (result && result.rendered === false) console.warn('[PikabuSDK] ad not shown:', result.reason);
			if (rewarded && result && result.reward && cb.onRewarded) cb.onRewarded();
			if (cb.onClose) cb.onClose(!!(result && result.rendered));
		} catch (e) {
			console.warn('[PikabuSDK] ad error', e);
			if (cb.onError) cb.onError(e);
		}
	};
	let started = false;
	return {
		adv: {
			showFullscreenAdv: (o) => run(ads.fullscreen, (o && o.callbacks) || {}, false),
			showRewardedVideo: (o) => run(ads.rewarded, (o && o.callbacks) || {}, true),
			showBannerAdv: () => {},
			hideBannerAdv: () => {},
		},
		features: { LoadingAPI: { ready: () => {
			if (started) return;
			started = true;
			try { sdk.gameStarted(); } catch (e) { console.warn('[PikabuSDK] gameStarted', e); }
		} } },
		environment: { i18n: { lang: 'ru' } },
		getPlayer: () => Promise.resolve(catPikabuPlayer(sdk)),
		auth: { openAuthDialog: () => sdk.auth.openAuthDialog() },
	};
}

// Start: load the SDK; the engine starts once it is ready, or anyway after a few seconds
// (an ad blocker, or the page opened outside Pikabu: the game must still work).
(function () {
	let engineStarted = false;
	const start = () => {
		if (engineStarted) return;
		engineStarted = true;
		startGodotEngine('ru');
	};
	const s = document.createElement('script');
	s.src = 'https://games.pikabu.ru/sdk/sdk.js';
	s.async = true;
	s.onload = async () => {
		try {
			const sdk = await PkbSDK.init();
			window.pkb = sdk;
			window.ysdk = catMakeYsdkShim(sdk);
			window.ysdkPlayerPromise = Promise.resolve(catPikabuPlayer(sdk));
			console.log('[PikabuSDK] ready, player', sdk.player && sdk.player.id);
			// mobile only, before gameStarted(); the engine loads meanwhile
			const pre = sdk.ads && sdk.ads.preloader;
			if (pre && pre.isSupported) pre.canShow().then((ok) => { if (ok) pre.show(); }).catch(() => {});
		} catch (e) {
			console.warn('[PikabuSDK] init failed, starting without it', e);
		}
		start();
	};
	s.onerror = () => { console.warn('[PikabuSDK] sdk.js not loaded (ad blocker?), starting without it'); start(); };
	document.head.appendChild(s);
	setTimeout(start, 8000);
})();

		</script>
	</body>
